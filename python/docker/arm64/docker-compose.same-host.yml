name: agent-sdk-ab

services:
  agent-a:
    image: "${AGENT_IMAGE:-agent-connect-sdk:0.17.9-arm64}"
    container_name: agent-sdk-a
    command: ["run-agent-a.sh", "${AGENT_REGISTRATION_MODE:-fresh-register}"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      AGENT_RUNTIME_IP: "${AGENT_A_RUNTIME_IP:-172.29.100.1}"
      AGENT_RUNTIME_PORT: "${AGENT_A_RUNTIME_PORT:-8088}"
      MASQUE_URL: "${AGENT_A_MASQUE_URL:-https://172.29.100.1:8443/.well-known/masque/ip}"
      MASQUE_TOKEN: "${AGENT_A_MASQUE_TOKEN:-}"
      AGENT_TUN_NAME: "${AGENT_A_TUN_NAME:-agent_tun0}"
      AGENT_TUN_MTU: "${AGENT_TUN_MTU:-1280}"
      AGENT_LOG_FILE: /var/log/agent-sdk/agent-a.log
      AGENT_FULL_INTERFACE_SUITE: "${AGENT_FULL_INTERFACE_SUITE:-true}"
      AGENT_TARGET_CAPABILITY: "${AGENT_TARGET_CAPABILITY:-robot dog}"
      AGENT_COMPUTE_CAPABILITY_ID: "${AGENT_COMPUTE_CAPABILITY_ID:-dog-vision}"
      AGENT_COMPUTE_CPU_MILLICORES: "${AGENT_COMPUTE_CPU_MILLICORES:-2000}"
      AGENT_COMPUTE_MEMORY_MIB: "${AGENT_COMPUTE_MEMORY_MIB:-4096}"
      AGENT_COMPUTE_TIMEOUT: "${AGENT_COMPUTE_TIMEOUT:-30}"
      AGENT_SANDBOX_TIMEOUT: "${AGENT_SANDBOX_TIMEOUT:-15}"
      AGENT_RECOGNITION_TARGET: "${AGENT_RECOGNITION_TARGET:-寻找穿红色衣服的人}"
      AGENT_CONTROL_TEXT: "${AGENT_CONTROL_TEXT:-向左移动一米}"
      AGENT_CONTROL_LANGUAGE: "${AGENT_CONTROL_LANGUAGE:-zh-CN}"
      AGENT_COMPUTE_TERMINAL_ACTION: "${AGENT_COMPUTE_TERMINAL_ACTION:-release}"
      AGENT_MEDIA_TIMEOUT: "${AGENT_MEDIA_TIMEOUT:-120}"
      AGENT_PROCESSED_FRAME_COUNT: "${AGENT_PROCESSED_FRAME_COUNT:-1}"
      AGENT_PROCESSED_FRAME_TIMEOUT: "${AGENT_PROCESSED_FRAME_TIMEOUT:-30}"
      AGENT_FORCE_REGISTRATION: "${AGENT_FORCE_REGISTRATION:-false}"
      AGENT_FRESH_REGISTRATION: "${AGENT_FRESH_REGISTRATION:-true}"
      AGENT_DEREGISTER_ON_EXIT: "${AGENT_DEREGISTER_ON_EXIT:-true}"
    networks:
      agent-access:
        ipv4_address: "${AGENT_A_CONTAINER_IP:-172.29.100.2}"
    volumes:
      - agent-a-state:/var/lib/agent-sdk
      - agent-a-logs:/var/log/agent-sdk
    stop_grace_period: 15s

  agent-b:
    image: "${AGENT_IMAGE:-agent-connect-sdk:0.17.9-arm64}"
    container_name: agent-sdk-b
    command: ["run-agent-b.sh", "${AGENT_REGISTRATION_MODE:-fresh-register}"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      AGENT_RUNTIME_IP: "${AGENT_B_RUNTIME_IP:-172.29.100.1}"
      AGENT_RUNTIME_PORT: "${AGENT_B_RUNTIME_PORT:-8089}"
      MASQUE_URL: "${AGENT_B_MASQUE_URL:-https://172.29.100.1:8444/.well-known/masque/ip}"
      MASQUE_TOKEN: "${AGENT_B_MASQUE_TOKEN:-}"
      AGENT_TUN_NAME: "${AGENT_B_TUN_NAME:-agent_tun0}"
      AGENT_TUN_MTU: "${AGENT_TUN_MTU:-1280}"
      AGENT_LOG_FILE: /var/log/agent-sdk/agent-b.log
      AGENT_FULL_INTERFACE_SUITE: "${AGENT_FULL_INTERFACE_SUITE:-true}"
      AGENT_SKILL: "${AGENT_SKILL:-robot dog}"
      AGENT_CAPABILITY: "${AGENT_CAPABILITY:-dog-vision}"
      AGENT_CAPABILITY_UPDATE_PROBE: "${AGENT_CAPABILITY_UPDATE_PROBE:-full-interface-probe}"
      AGENT_UPLOAD_CONTROL_DELAY: "${AGENT_UPLOAD_CONTROL_DELAY:-0.25}"
      AGENT_VIDEO_SOURCE: "${AGENT_VIDEO_SOURCE:-file}"
      AGENT_VIDEO_FILE: "${AGENT_VIDEO_FILE:-/opt/agent-sdk/examples/assets/video-offload-test.mp4}"
      AGENT_LOOP_VIDEO: "${AGENT_LOOP_VIDEO:-true}"
      AGENT_CAMERA_ID: "0"
      AGENT_VIDEO_WIDTH: "${AGENT_VIDEO_WIDTH:-1280}"
      AGENT_VIDEO_HEIGHT: "${AGENT_VIDEO_HEIGHT:-720}"
      AGENT_VIDEO_FPS: "${AGENT_VIDEO_FPS:-30}"
      AGENT_VIDEO_BITRATE_KBPS: "${AGENT_VIDEO_BITRATE_KBPS:-2500}"
      AGENT_MEDIA_TIMEOUT: "${AGENT_MEDIA_TIMEOUT:-120}"
      AGENT_SESSION_CLOSE_TIMEOUT: "${AGENT_SESSION_CLOSE_TIMEOUT:-60}"
      AGENT_MAX_SESSIONS: "${AGENT_MAX_SESSIONS:-1}"
      AGENT_FORCE_REGISTRATION: "${AGENT_FORCE_REGISTRATION:-false}"
      AGENT_FRESH_REGISTRATION: "${AGENT_FRESH_REGISTRATION:-true}"
      AGENT_DEREGISTER_ON_EXIT: "${AGENT_DEREGISTER_ON_EXIT:-true}"
    networks:
      agent-access:
        ipv4_address: "${AGENT_B_CONTAINER_IP:-172.29.100.3}"
    volumes:
      - agent-b-state:/var/lib/agent-sdk
      - agent-b-logs:/var/log/agent-sdk
    stop_grace_period: 15s

networks:
  agent-access:
    name: "${AGENT_ACCESS_NETWORK:-agent-sdk-access}"
    driver: bridge
    ipam:
      config:
        - subnet: "${AGENT_ACCESS_SUBNET:-172.29.100.0/24}"
          gateway: "${AGENT_ACCESS_GATEWAY:-172.29.100.1}"

volumes:
  agent-a-state:
  agent-a-logs:
  agent-b-state:
  agent-b-logs:
