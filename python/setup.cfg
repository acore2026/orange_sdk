[metadata]
name = agent-connect-sdk
version = 0.1.0
description = Agent SDK with MASQUE CONNECT-IP transport for Linux
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    aiohttp>=3.9,<4
    aioquic>=1.3,<2
    cryptography>=42,<47
    httpx>=0.25,<1
    pyroute2>=0.7,<1

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=8,<9
    pytest-asyncio>=0.23,<2
