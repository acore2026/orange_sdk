[metadata]
name = agent-connect-sdk
version = 0.9.0
description = Agent SDK with MASQUE CONNECT-IP transport for Linux
long_description = file: README.md
long_description_content_type = text/markdown
platforms = Linux
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: POSIX :: Linux

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    aiohttp>=3.9,<4
    aioquic>=1.3,<2
    cryptography>=42,<47
    httpx>=0.25,<1
    pyroute2>=0.7,<1

[options.packages.find]
where = src

[options.package_data]
agent_sdk =
    py.typed
    certs/*.pem

[options.entry_points]
console_scripts =
    agent-masque-proxy = agent_sdk.cli:masque_proxy_main
    agent-sdk-self-check = agent_sdk.full_flow_demo:main

[options.extras_require]
test =
    pytest>=8,<9
    pytest-asyncio>=0.23,<2
dev =
    build>=1.2,<2
    pytest>=8,<9
    pytest-asyncio>=0.23,<2
    twine>=5,<7
